plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    implementation project(':common')
    implementation "com.github.luben:zstd-jni:${project.zstd_version}"
    compileOnly "io.netty:netty-all:${project.netty_version}"
    compileOnly "io.papermc.paper:paper-api:${project.paper_version}"
    runtimeOnly "io.papermc.paper:paper-api:${project.paper_version}"
}

processResources {
    def ver = project.version.toString()
    filesMatching('plugin.yml') {
        expand 'version': ver
    }
}

jar {
    dependsOn project(':common').jar
    manifest {
        attributes(
            'Main-Class': 'com.rigorberto.zstdnetworkproject.paper.ZstdNetworkProjectPaper',
            'Plugin-Version': project.version,
            'Implementation-Version': project.version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources') {
        include 'plugin.yml'
    }
    from(zipTree(project(':common').jar.archiveFile)) {
        include 'com/rigorberto/zstdnetworkproject/**'
    }
    def zstdVersion = project.zstd_version
    def runtimeClasspath = configurations.runtimeClasspath
    from {
        def zstd = runtimeClasspath.find { it.name == "zstd-jni-${zstdVersion}.jar" }
        zstd ? zipTree(zstd).matching { exclude 'META-INF/MANIFEST.MF' } : []
    }
}
