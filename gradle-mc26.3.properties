# Version group for Minecraft 26.3 (unobfuscated, Java 25).
# Used by build-all scripts; pass every entry with -P when building.
# yarn_mappings is unused in this era (no remapping needed).
minecraft_version=26.3
neoforge_version=26.3.0.7-beta
paper_version=26.3.build.28-alpha
fabric_api_version=0.161.0+26.3
# 26.x era targets Java 25; without these the modules default to Java 21 and
# neoforge/paper dependency variants fail to resolve.
paper_java_version=25
neoforge_java_version=25
fabric_java_version=25