# Version group for Minecraft 26.3 (unobfuscated, Java 25).
# Used by build-all scripts; pass every entry with -P when building.
# yarn_mappings is unused in this era (no remapping needed).
# Paper 26.3 has no stable build yet; this group pins the newest available alpha.
# fabric/neoforge are omitted on purpose: there is no 26.3 release for them at the
# time of writing, and build-all skips any module whose version key is absent.
minecraft_version=26.3
paper_version=26.3.build.5-alpha