# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G

# Share compiled outputs across the many Minecraft version builds and build modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true

# Let Gradle discover the JDKs installed by actions/setup-java (JAVA_HOME is always
# auto-detected; JAVA_HOME_21_X64/JAVA_HOME_25_X64 make the other toolchain visible
# without a foojay download). Unset env vars are simply ignored.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Mod Properties
mod_version=beta-0.2
maven_group=com.rigorberto
archives_base_name=ZstdNetworkProject

# =========================================================
# Minecraft version switch.
#
# Each supported Minecraft version has its own group file
# (gradle-mc<version>.properties) used by build-all scripts:
#   gradle-mc1.21.4.properties  -> 1.21.4 (obfuscated, Java 21)
#   gradle-mc26.2.properties    -> 26.2  (unobfuscated, Java 25)
#
# The values below are the DEFAULT used by a plain ./gradlew build
# (no -P overrides). Velocity is version-independent and is always
# built against Java 25 (velocity_java_version).
# =========================================================

# Minecraft version
minecraft_version=26.2

# Dependencies
neoforge_version=26.2.0.59
paper_version=26.2.build.112-stable
velocity_version=4.1.0-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.157.0+26.2
yarn_mappings=1.21.4+build.8

# Toolchain / build plugins
loom_version=1.18.0-alpha.15
moddev_version=2.0.143
netty_version=4.2.17.Final
zstd_version=1.5.7-14

# Velocity 4.1.0 requires Java 25+ regardless of the Minecraft version being targeted.
velocity_java_version=25
