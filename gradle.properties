# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G

# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=com.rigorberto
archives_base_name=ZstdNetworkProject

# =========================================================
# Minecraft version switch. Set the pair below as a group.
#
#   For Minecraft 1.21.11 (obfuscated, Java 21):
#     minecraft_version=1.21.11
#     neoforge_version=21.11.45
#     paper_version=1.21.11-R0.1-SNAPSHOT
#     fabric_loader_version=0.19.3
#     fabric_api_version=0.141.6+1.21.11
#     yarn_mappings=1.21.11+build.6
#
#   For Minecraft 26.2 (unobfuscated, Java 25):
#     minecraft_version=26.2
#     neoforge_version=26.2.0.48-beta
#     paper_version=26.2.build.98-stable
#     fabric_loader_version=0.19.3
#     fabric_api_version=0.156.0+26.2
#     yarn_mappings=<unused in this era>
# =========================================================

# Minecraft version
minecraft_version=1.21.11

# Dependencies
neoforge_version=21.11.45
paper_version=1.21.11-R0.1-SNAPSHOT
velocity_version=4.1.0-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.141.6+1.21.11
yarn_mappings=1.21.11+build.6

# Toolchain / build plugins
loom_version=1.17.18
moddev_version=2.0.143
netty_version=4.1.136.Final
zstd_version=1.5.6-4

# Velocity 4.1.0 requires Java 25+ regardless of the Minecraft version being targeted.
velocity_java_version=25
