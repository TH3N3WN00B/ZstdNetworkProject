pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Paper'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Auto-downloads missing toolchains (Java 21 for obfuscated, 25 for 26.x/velocity),
    // so the build works on GitHub Actions and any fresh machine without preinstalled JDKs.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ZstdNetworkProject'

// common and velocity are always part of the build. The MC-targeted modules are
// only included when their version is supplied on the command line; build-all.ps1
// passes every key of each gradle-mc<version>.properties file, so a group that omits
// e.g. fabric_api_version (no fabric release for that Minecraft yet) simply leaves
// the module out instead of failing loom configuration at configure time.
def requested = { String key -> gradle.startParameter.projectProperties.containsKey(key) }
def optionalModules = [
        'fabric'  : 'fabric_api_version',
        'neoforge': 'neoforge_version',
        'paper'   : 'paper_version'
]

include 'common'
include 'velocity'
project(':common').projectDir = file('common')
project(':velocity').projectDir = file('velocity')

optionalModules.each { name, versionKey ->
    if (requested(versionKey)) {
        include name
        project(":$name").projectDir = file(name)
    }
}
