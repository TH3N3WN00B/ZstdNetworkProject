pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Paper'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Auto-downloads missing toolchains (Java 21 for obfuscated, 25 for 26.x/velocity),
    // so the build works on GitHub Actions and any fresh machine without preinstalled JDKs.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ZstdNetworkProject'

include 'common'
include 'fabric'
include 'neoforge'
include 'paper'
include 'velocity'

// The forge module is scoped to Minecraft 26.2 for now (ForgeGradle 7), which is a
// different plugin/toolchain than the 1.21.x era, so it is only included for builds
// targeting a Forge-supported version.
def mcVersion = gradle.startParameter.projectProperties.get('minecraft_version') ?: '1.21.11'
def forgeSupported = ['26.2'].contains(mcVersion)
if (forgeSupported) {
    include 'forge'
}

project(':common').projectDir = file('common')
project(':fabric').projectDir = file('fabric')
project(':neoforge').projectDir = file('neoforge')
project(':paper').projectDir = file('paper')
project(':velocity').projectDir = file('velocity')
if (forgeSupported) {
    project(':forge').projectDir = file('forge')
}
