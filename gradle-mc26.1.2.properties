# Version group for Minecraft 26.1.2 (unobfuscated, Java 25).
# Used by build-all scripts; pass every entry with -P when building.
# yarn_mappings is unused in this era (no remapping needed).
minecraft_version=26.1.2
neoforge_version=26.1.2.108
paper_version=26.1.2.build.74-stable
fabric_api_version=0.155.2+26.1.2
# 26.x era targets Java 25 (velocity_java_version already does); without these the
# modules default to Java 21 and neoforge/paper dependency variants fail to resolve.
paper_java_version=25
neoforge_java_version=25
fabric_java_version=25
