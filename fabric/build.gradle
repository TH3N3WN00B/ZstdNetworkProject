plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

apply plugin: rootProject.minecraftEra == 'obfuscated' ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

['jar', 'remapJar', 'remapSourcesJar', 'sourcesJar'].each { name ->
    if (tasks.findByName(name) != null) {
        tasks.named(name).configure { archiveVersion = "${rootProject.mod_version}-mc${project.minecraft_version}" }
    }
}

jar {
    dependsOn project(':common').jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(project(':common').jar.archiveFile)) {
        include 'com/rigorberto/zstdnetworkproject/**'
    }
    def zstdVersion = project.zstd_version
    def runtimeClasspath = configurations.runtimeClasspath
    from {
        def zstd = runtimeClasspath.find { it.name == "zstd-jni-${zstdVersion}.jar" }
        zstd ? zipTree(zstd).matching { exclude 'META-INF/MANIFEST.MF' } : []
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir "src/${rootProject.minecraftEra}/java"
        }
        resources {
            srcDir "src/${rootProject.minecraftEra}/resources"
        }
    }
}

loom {
    if (rootProject.minecraftEra == 'obfuscated') {
        accessWidenerPath = file("src/obfuscated/resources/zstdnetworkproject.classtweaker")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (rootProject.minecraftEra == 'obfuscated') {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }
    implementation project(':common')
    implementation "com.github.luben:zstd-jni:${project.zstd_version}"
}

processResources {
    def modVersion = project.version
    def loaderVersion = project.fabric_loader_version
    def mcVersion = project.minecraft_version
    inputs.property "version", modVersion
    inputs.property "loader_version", loaderVersion
    inputs.property "minecraft_version", mcVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion, "loader_version": loaderVersion, "minecraft_version": mcVersion
    }
}

