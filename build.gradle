// Enforce Netty 4.2.18 for protocol compatibility (all modules)
ext {
    nettyVersion = '4.2.18'
    velocityVersion = '4.2.0' // Stable, requires JVM 25+, targets Java 21 bytecode
    // Minecraft era: 1.21.x is obfuscated (yarn remap via loom-remap), 26.x is
    // unobfuscated (plain loom). Derived from the -Pminecraft_version group value
    // so fabric can pick its plugin at apply time. Mirrors neoforge.build.gradle.
    minecraftEra = (findProperty('minecraft_version') ?: '26.2').toString().startsWith('26.') ? 'unobfuscated' : 'obfuscated'
}

// Force Gradle to use JVM 27 for everything (dependency resolution + compilation)
gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(27)
        }
        options.encoding = "UTF-8"
        options.release = (project.findProperty("${project.name}_java_version") ?: 21).toString()
    }
    
    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(27)
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'velocity'; url = 'https://maven.fabricmc.net/' }
}

// Force Gradle to use JVM 27 for everything
gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(27)
        }
        options.encoding = "UTF-8"
        options.release = (project.findProperty("${project.name}_java_version") ?: 21).toString()
    }
    
    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(27)
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = rootProject.maven_group
    version = "${rootProject.mod_version}-mc${rootProject.minecraft_version}"

    base {
        archivesName = "zstd-${project.name}"
    }

    def projectJavaVersion = (project.findProperty("${project.name}_java_version") ?: "21").toString().toInteger()

    java {
        sourceCompatibility = JavaVersion.toVersion(projectJavaVersion)
        targetCompatibility = JavaVersion.toVersion(projectJavaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = projectJavaVersion
    }

    // Velocity API 4.2.1-SNAPSHOT for protocol compatibility (Minecraft 26.x, Java 25+)
    // Only applies to projects that need Velocity (velocity module)
    if (project.name == 'velocity') {
        dependencies {
            implementation "com.velocitypowered:velocity-api:${rootProject.ext.velocityVersion}"
            testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        }
    }
}

// Copy all JARs to dist directory
tasks.register('copyToDist', Copy) {
    from rootProject.layout.buildDirectory.dir('libs')
    into rootProject.file('dist')
    include '*.jar'
}

tasks.register('copyPluginJars', Copy) {
    from rootProject.layout.buildDirectory.dir('classes')
    into rootProject.file('dist')
}

tasks.register('buildAll', DefaultTask) {
    dependsOn rootProject.tasks.named('build')
    dependsOn tasks.named('copyToDist')
}
