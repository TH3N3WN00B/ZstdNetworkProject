plugins {
    id 'java-library'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

configurations.all {
    resolutionStrategy {
        force 'com.google.code.gson:gson:2.13.2'
        force 'com.google.guava:guava:33.5.0-jre'
        force 'org.slf4j:slf4j-api:2.0.17'
        force 'org.checkerframework:checker-qual:3.53.0'
        force 'com.google.errorprone:error_prone_annotations:2.43.0'
        force 'org.jetbrains:annotations:26.0.2'
    }
}

dependencies {
    implementation project(':common')
    implementation 'com.github.luben:zstd-jni:1.5.6-4'
    compileOnly 'io.netty:netty-all:4.2.16.Final'
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
    runtimeOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.rigorberto.zstdnetworkproject.velocity.ZstdNetworkProjectVelocity',
            'Plugin-Version': project.version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources') {
        include 'velocity-plugin.json'
    }
}