plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

configurations.all {
    resolutionStrategy {
        force 'com.google.code.gson:gson:2.14.0'
        force 'com.google.guava:guava:33.6.0-jre'
        force 'org.slf4j:slf4j-api:2.1.0-alpha1'
        force 'org.checkerframework:checker-qual:4.2.2'
        force 'com.google.errorprone:error_prone_annotations:2.50.0'
        force 'org.jetbrains:annotations:26.1.0'
    }
}

dependencies {
    implementation project(':common')
    implementation "com.github.luben:zstd-jni:${project.zstd_version}"
    compileOnly "io.netty:netty-all:${project.netty_version}"
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
    runtimeOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
}

processResources {
    def ver = project.version.toString()
    filesMatching('velocity-plugin.json') {
        expand 'version': ver
    }
}

jar {
    dependsOn project(':common').jar
    manifest {
        attributes(
            'Main-Class': 'com.rigorberto.zstdnetworkproject.velocity.ZstdNetworkProjectVelocity',
            'Plugin-Version': project.version,
            'Implementation-Version': project.version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources') {
        include 'velocity-plugin.json'
    }
    from(zipTree(project(':common').jar.archiveFile)) {
        include 'com/rigorberto/zstdnetworkproject/**'
    }
    def zstdVersion = project.zstd_version
    def runtimeClasspath = configurations.runtimeClasspath
    from {
        def zstd = runtimeClasspath.find { it.name == "zstd-jni-${zstdVersion}.jar" }
        zstd ? zipTree(zstd).matching { exclude 'META-INF/MANIFEST.MF' } : []
    }
}
