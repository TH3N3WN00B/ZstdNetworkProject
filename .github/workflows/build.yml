name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fabric Loom 1.18.0-alpha.15 requires the Gradle daemon itself to run on
      # JVM 25, so JAVA_HOME must point at JDK 25 for the build. The obfuscated
      # (1.21.x) modules still compile against the Java 21 toolchain, which Gradle
      # discovers via JAVA_HOME_21_X64 (see gradle.properties fromEnv setting).
      - name: Set up JDK 21 (toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25 (toolchain + JAVA_HOME)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build all Minecraft versions and Velocity
        shell: bash
        timeout-minutes: 180
        run: |
          chmod +x gradlew build-all.sh
          bash build-all.sh
          echo "Built $(find dist -maxdepth 1 -name '*.jar' | wc -l) jars"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zstd-dist
          path: dist/*.jar
          if-no-files-found: error
