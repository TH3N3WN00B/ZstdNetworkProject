plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    mods {
        "zstdnetworkproject" {
            sourceSet sourceSets.main
        }
    }
}

// The client debug overlay hooks render APIs that changed between eras
// (GuiGraphics vs GuiGraphicsExtractor), so each build compiles only its own
// overlay implementation, mirroring the fabric module's layout.
def overlaySrc = project.minecraft_version.startsWith('26.') ? 'unobfuscated' : 'obfuscated'
sourceSets.main.java.srcDirs += file("src/${overlaySrc}/java")

dependencies {
    implementation project(':common')
    implementation "com.github.luben:zstd-jni:${project.zstd_version}"
}

jar {
    dependsOn project(':common').jar
    manifest {
        attributes(
            'Mod-Container': 'com.rigorberto.zstdnetworkproject.neoforge.ZstdNetworkProjectNeoForge',
            'Mod-Version': project.version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources') {
        include 'META-INF/neoforge.mods.toml'
    }
    from(zipTree(project(':common').jar.archiveFile)) {
        include 'com/rigorberto/zstdnetworkproject/**'
    }
    def zstdVersion = project.zstd_version
    def runtimeClasspath = configurations.runtimeClasspath
    from {
        def zstd = runtimeClasspath.find { it.name == "zstd-jni-${zstdVersion}.jar" }
        zstd ? zipTree(zstd).matching { exclude 'META-INF/MANIFEST.MF' } : []
    }
}
